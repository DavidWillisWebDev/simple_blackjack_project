<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Blackjack</title>
    <script src="script.js"></script>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image" href="blackjack_favicon.png">
</head>
<body>
    <div class="header">
        <!-- <button class="newGameButton" onclick="start()" title="Start a new game.">Deal New</button> -->
         <div class="headerColorB">♠</div>
        <button class="headerButton" onclick="reset()" title="Reset the game.">Reset</button>
        <div class="headerColorR">♥</div>
        <button class="headerButton" id="pauseGame" onclick="pause()" title="Pause the game.">Pause</button>
        <div class="headerColorR">♦</div>
        <button class="headerButton" id="settings" onclick="customization()" title="Change various settings.">Settings</button>
        <div class="headerColorB">♣</div>
    </div>
    <div class="mainContent">
        <div class="pointCountDisplay">
            <div class="playerPointCountDisplay" id="displayPlayerPoints" title="The player's points.">Player's Point Count: 0</div>
            <div class="dealerPointCountDisplay" id="displayDealerPoints" title="The dealer's points.">Dealer's Point Count: 0</div>
        </div>
        <div class="handDisplay">
            <div class="playerHandDisplay" id="displayPlayer" title="The player's hand."></div>
            <div class="dealerHandDisplay" id="displayDealer" title="The dealer's hand."></div>
        </div>
        <div class="buttonContainer">
            <button class="drawButton" onclick="drawCard()" title="Draw card.">🂠</button>
            <div class="turnDisplay" id="switchPlayers" title="Shows the current player's turn.">Player's turn.</div>
            <button class="passButton" onclick="pass()" title="Skip a turn.">Pass</button>
        </div>
    </div>
</body>
</html>
